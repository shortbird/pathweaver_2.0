# CI-04. Nothing watched dependencies before this; the only signal was pip-audit
# failing the build once a CVE was already published against a pinned version.
#
# Grouped and weekly on purpose. Ungrouped dependabot on a repo with three
# ecosystems opens a dozen PRs a week, which is how teams learn to ignore it.
# Minor and patch updates arrive as ONE pr per ecosystem; majors come
# individually, because those are the ones that need reading.
#
# Note the pip entry points at the repository root, not backend/. The Render
# build installs the ROOT requirements.txt (see docs/OPS_HISTORY.md and the
# pip-audit step in tests-backend.yml, which was audited against the wrong file
# until DEP-H1). backend/requirements.txt is watched too, since new backend deps
# have to be added to both.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend-v2"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      mobile-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        update-types: ["minor", "patch"]
