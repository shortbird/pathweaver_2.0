# CI-04. Nothing watched dependencies before this; the only signal was pip-audit
# failing the build once a CVE was already published against a pinned version.
#
# Grouped and weekly on purpose. Ungrouped dependabot on a repo with three
# ecosystems opens a dozen PRs a week, which is how teams learn to ignore it.
#
# The per-ecosystem limit is 2, not 5. On its first run this config opened 20
# PRs at once across five ecosystems and every one of them started a full CI
# run, which buried the queue. Grouping does not help with the initial backlog
# -- only the limit does.
# Minor and patch updates arrive as ONE pr per ecosystem; majors come
# individually, because those are the ones that need reading.
#
# Note the pip entry points at the repository root, not backend/. The Render
# build installs the ROOT requirements.txt (see docs/OPS_HISTORY.md and the
# pip-audit step in tests-backend.yml, which was audited against the wrong file
# until DEP-H1). backend/requirements.txt is watched too, since new backend deps
# have to be added to both.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    # The Google stack is held where google-generativeai can install it.
    # google-generativeai needs protobuf below 6 and pins
    # google-ai-generativelanguage to 0.6.15; newer google-api-core needs
    # protobuf 6.33+, and google-auth 2.40 needs cachetools below 6. On
    # 2026-10-12 a group PR bumped these together and pip could not resolve
    # it (#169), then a cachetools 7 PR failed the same way (#176). Lift
    # these when the AI services move to google-genai.
    ignore:
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cachetools"
        update-types: ["version-update:semver-major"]
      - dependency-name: "google-ai-generativelanguage"
      - dependency-name: "google-api-core"
      - dependency-name: "google-api-python-client"
      - dependency-name: "google-auth"
      - dependency-name: "google-auth-httplib2"
      - dependency-name: "googleapis-common-protos"
      - dependency-name: "grpcio"
      - dependency-name: "grpcio-status"
      - dependency-name: "proto-plus"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    # 8.71.x reports plain JavaScript values as "only used as a type" through
    # unused-imports/no-unused-vars: 29016 warnings against a baseline of
    # 1819, which fails the eslint ratchet (#170, #174). Only that line is
    # skipped, so a fixed 8.72 still arrives.
    ignore:
      - dependency-name: "@typescript-eslint/*"
        versions: ["8.71.x"]
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    # The native layer moves with the Expo SDK, never with dependabot. The app
    # matches an OTA by app version (runtimeVersion policy "appVersion"), so a
    # bump here ships JS built against a native version the phones in the field
    # do not have. On 2026-10-12 a "minor-patch" group carried react-native
    # 0.83.6 -> 0.87.1, react 19.3, reanimated 4.7 and worklets 0.13 together.
    # Upgrade these with `npx expo install --fix` during an SDK upgrade and a
    # new store build.
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "@react-navigation/*"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "jest-expo"
    groups:
      mobile-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        update-types: ["minor", "patch"]
