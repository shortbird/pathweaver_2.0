name: Apply migrations to production

# OPS-03. Until this existed, migrations reached production by hand -- MCP
# apply_migration, the SQL editor, or a local CLI -- and supabase/migrations/
# was a record of intent rather than the mechanism. That is why the history
# table and the directory disagree (see supabase/migrations/README.md), and why
# the db-exposure audit workflow had to exist at all.
#
# ── THIS IS MANUAL ON PURPOSE
#
# It is workflow_dispatch only. It is deliberately NOT wired into release.yml:
# a schema change that a deploy applies for you is a schema change nobody
# decided to make at a particular moment, and the failure mode is a locked table
# on a production database during a release.
#
# ── THE HISTORY IS RECONCILED (2026-09-09)
#
# This block used to say `db push` would attempt ~59 already-applied migrations
# and that you must reconcile before the first apply. That was true and it is
# now done: 66 rows were written to supabase_migrations.schema_migrations, which
# went from 96 rows to 162, and every file in supabase/migrations/ now has a
# history row except the ones genuinely not yet applied. See
# docs/remediation-2026-09/MIGRATION_RECONCILIATION.md for the file-by-file
# evidence and docs/remediation-2026-09/reconcile_schema_migrations.sql for what
# ran.
#
# So `plan` reporting a small number is now the expected, healthy state. A count
# in the dozens means something has regressed -- read the reconciliation doc
# before applying anything.
#
# ── AND THE COUNT USED TO BE A LIE
#
# Until 2026-09-09 the awk below stripped spaces but not the backticks the CLI
# wraps every cell in, so it printed 0 for ANY input. Two things followed:
#
#   - `apply` was unreachable. Its first guard refuses when nothing is pending,
#     and nothing was ever pending as far as this file could tell.
#   - The max_pending tripwire below -- which the section further down calls
#     "the point of the whole file" -- was dead code. 0 is never greater than 3.
#
# The protection was real by accident, not by design: the wrong guard blocked
# everything for the wrong reason. It was found by running `plan` against a
# freshly reconciled history, expecting 1 and getting 0.
#
# If you change the awk, test it against real `migration list` output, not
# against what you assume the format is. That is the exact mistake being fixed.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = show what would apply (safe, read-only). apply = run db push."
        type: choice
        options: [plan, apply]
        default: plan
      confirm:
        description: "For apply only: type  APPLY TO PRODUCTION"
        type: string
        default: ""
      max_pending:
        description: "Refuse to apply if more than this many migrations are pending."
        type: string
        default: "3"

concurrency:
  # Two concurrent db pushes against one database is the worst outcome here.
  group: migrate-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.list.outputs.pending }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1 is not set — see supabase/migrations/README.md"; exit 1; }
          [ -n "${ACCESS_TOKEN:-}" ] || fail "secret SUPABASE_ACCESS_TOKEN"
          [ -n "${DB_PASSWORD:-}" ]  || fail "secret SUPABASE_DB_PASSWORD"

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'vvfgxcykxjybtvpfzwyx' }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: What would apply
        id: list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations.txt
          # Rows are "  local | remote | time". A row with a local version and
          # an empty remote column is a migration db push would attempt.
          # The CLI wraps every cell in backticks -- `20260909163208` -- and an
          # empty remote column is ` `, not blank. Stripping only spaces left
          # $1 as `20260909163208` (never matching the digit anchor) and $2 as
          # `` (never equal to ""), so this counted 0 for ANY input from the
          # day it was written. That made `apply` unreachable, since its first
          # guard is "refuse when nothing is pending", and it made the
          # max_pending tripwire -- the guard this file's header calls its whole
          # point -- dead code that could never fire. Strip the backticks too.
          pending=$(awk -F'|' '
            NF >= 2 {
              gsub(/[ `]/, "", $1); gsub(/[ `]/, "", $2)
              if ($1 ~ /^[0-9]{14}$/ && $2 == "") n++
            }
            END { print n+0 }' /tmp/migrations.txt)
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          {
            echo "### Migrations pending against production: **$pending**"
            echo
            echo '```'
            cat /tmp/migrations.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Interpret the count
        run: |
          set -euo pipefail
          pending='${{ steps.list.outputs.pending }}'
          echo "Pending: $pending"
          if [ "$pending" -gt 10 ]; then
            echo "::warning::$pending migrations are pending. If you expected one or two, the history table is out of sync with supabase/migrations/ — see that directory's README. Do NOT apply until it is reconciled."
          fi

  apply:
    name: Apply (db push)
    needs: [plan]
    if: inputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Requires a reviewer if the `production` environment has required
    # reviewers configured — which is the manual-approval gate this item asked
    # for. Without that configuration the environment is inert and the typed
    # confirmation below is the only thing standing between a dispatch and a
    # schema change.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Confirm intent
        env:
          CONFIRM: ${{ inputs.confirm }}
          PENDING: ${{ needs.plan.outputs.pending }}
          MAX_PENDING: ${{ inputs.max_pending }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "APPLY TO PRODUCTION" ]; then
            echo "::error::confirm input must be exactly: APPLY TO PRODUCTION"
            exit 1
          fi
          if [ "$PENDING" -eq 0 ]; then
            echo "Nothing pending. Stopping before touching anything."
            exit 1
          fi
          if [ "$PENDING" -gt "$MAX_PENDING" ]; then
            echo "::error::$PENDING migrations are pending, above the max_pending of $MAX_PENDING."
            echo "::error::This is what an unreconciled history looks like: db push would re-run migrations that are already applied. Reconcile with 'supabase migration repair --status applied <version>' (see supabase/migrations/README.md), or raise max_pending deliberately if you really do mean to apply $PENDING."
            exit 1
          fi
          echo "Applying $PENDING migration(s) to production."

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'vvfgxcykxjybtvpfzwyx' }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --linked

      - name: Record what is now applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          {
            echo "### Applied. History now reads:"
            echo '```'
            supabase migration list --linked
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
