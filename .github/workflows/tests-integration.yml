name: Integration Tests (reusable)

# The `requires_db` tests -- the ones that drive the real Flask app end to end
# against a real PostgREST + GoTrue, where mocks cannot help.
#
# WHAT CHANGED (2026-08-13)
# ------------------------
# This used to be integration-tests.yml: workflow_dispatch-only, pointed at a
# hand-created Supabase preview branch via three repo secrets, never in any
# gate. It ran exactly once, ever. Meanwhile 143 tests sat skipped, which reads
# like "covered, just not here" and is really "not covered at all".
#
# It now boots a throwaway Supabase stack on the runner instead:
#   - free (the preview-branch approach was billing real money -- see
#     supabase-branch-reaper.yml for what that cost)
#   - no service-role key for a production clone sitting in CI secrets
#   - cannot be aimed at production by a mistyped secret, because there is no
#     secret to mistype. The old workflow needed a string check on the URL as
#     the only thing standing between a typo and production data.
#
# This became possible on 2026-08-12, when supabase/migrations/ got a real
# baseline (d7ac23ea). Before that the first migration opened with
# `ALTER TABLE public.users` against an empty database and died at statement 0.
#
# NOT YET IN THE DEPLOY GATE. See the honesty note at the bottom of the run
# step: the harness is sound, but most of the suite it runs was written against
# an architecture the app does not have. Add this job to the `deploy` job's
# `needs:` in release.yml once the ported suite is green and meaningful.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Backend integration (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        # Boots Postgres + PostgREST + GoTrue + Storage in Docker (~60-90s) and
        # replays supabase/migrations/ onto the empty database, which is exactly
        # what the prod-schema baseline exists to make possible.
        run: |
          set -euo pipefail
          supabase start
          supabase status

      - name: Bootstrap the local stack
        # grants.sql: the baseline is schema-only by design, so PostgREST 42501s
        # on every request without it (verified -- this is not theoretical).
        # test_helpers.sql: the truncate-between-tests RPC the fixtures call.
        run: |
          set -euo pipefail
          for f in supabase/ci/grants.sql supabase/ci/test_helpers.sql; do
            echo "applying $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run requires_db tests
        working-directory: backend
        env:
          FLASK_ENV: testing
          FLASK_SECRET_KEY: test-secret-key-for-ci-only
          RUN_DB_INTEGRATION_TESTS: '1'
        run: |
          set -euo pipefail
          # Pull the local stack's URL and keys straight from the CLI rather than
          # from secrets. These are the well-known local development keys; they
          # are not sensitive and they unlock nothing outside this runner.
          eval "$(supabase status -o env | sed \
            -e 's/^API_URL=/export SUPABASE_URL=/' \
            -e 's/^SERVICE_ROLE_KEY=/export SUPABASE_SERVICE_ROLE_KEY=/' \
            -e 's/^ANON_KEY=/export SUPABASE_ANON_KEY=/')"
          echo "Target: $SUPABASE_URL"

          # No coverage here -- this is a subset of the suite, and coverage is
          # measured once in tests-backend.yml.
          #
          # The advisory escape hatch that used to live here is gone, on its own
          # instructions: "delete the branch and the input once the port is
          # done". The port is done -- 133 tests, all ten files, green and
          # enforcing since well before 2026-09-02. Nothing ever passed
          # `enforcing: false` anyway, because the input defaulted to true, so
          # this suite has gated every PR from its first run.
          python -m pytest tests/ -m requires_db --tb=short -v \
            -p no:cacheprovider --no-cov

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup || true
