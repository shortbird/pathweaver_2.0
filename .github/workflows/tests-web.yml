name: Web Tests (reusable)

# See tests-backend.yml for why the test jobs are reusable workflows rather
# than copies: one definition, called by both the pre-merge gate (ci.yml) and
# the release gate (release.yml).

on:
  workflow_call:
    inputs:
      coverage-floor:
        description: 'Minimum line coverage percent. Ratchet up, never down.'
        required: false
        default: 53
        type: number

permissions:
  contents: read

jobs:
  web:
    name: Web Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Generated constants match shared/data (no drift)
        # shared/data/*.json is the one definition of the pillar and subject
        # vocabularies, and the generator emits it into BOTH languages:
        # shared/generated/*.ts for the two apps, backend/generated/*.py for
        # Flask. This step re-runs the generator and fails if what it produces
        # differs from what is committed -- so editing the JSON without
        # regenerating, or hand-editing a generated file, stops the build
        # instead of quietly reintroducing the copies these files replaced.
        #
        # It lives in the WEB job because this job already has Node and the
        # backend job does not. The script has no dependencies, so it runs
        # before any install.
        run: node shared/scripts/generate-constants.mjs --check
      - name: Install dependencies
        working-directory: web
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for i in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $i failed; retrying..."; sleep 10
          done
          exit 1
      - name: npm audit (high/critical only)
        # Through the same gate the mobile job uses, and WITHOUT
        # --omit=dev. That flag is why five high advisories -- postcss
        # path traversal, browserslist OOM, nanoid, brace-expansion,
        # sharp/libvips -- sat here unreported until 2026-09-09. They do
        # not ship to a browser, but they run on every CI machine and
        # every developer laptop that builds this app, which is where the
        # credentials are. All five are fixed; the count is zero today.
        #
        # --omit=dev was also all-or-nothing in the other direction: one
        # unfixable advisory and the only green build is one that waives
        # every high. audit-gate.mjs takes them one at a time, each with a
        # reason and an expiry date. See scripts/audit-gate.mjs.
        run: node scripts/audit-gate.mjs --dir web
      - name: Run tests + coverage gate
        working-directory: web
        # Single run is both the pass/fail gate (pipefail) and the coverage gate.
        #
        # The floor was 44 while actual coverage was 54.44 -- ten points of slack,
        # which meant more than a fifth of the tested surface could be deleted
        # without the gate noticing. A floor below actual coverage does not
        # protect anything; it only records an old number. Ratcheted to 53 on
        # 2026-08-13 (1 point under measured, for flake tolerance).
        env:
          MIN_COVERAGE: ${{ inputs.coverage-floor }}
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee /tmp/cov.log
          LINE_PCT=$(grep -E '^All files' /tmp/cov.log | awk -F'|' '{gsub(/ /, "", $2); print $2}' | head -1)
          LINE_INT=${LINE_PCT%.*}
          echo "Line coverage: ${LINE_PCT:-0}% (required: ${MIN_COVERAGE}%)"
          if [ "${LINE_INT:-0}" -lt "${MIN_COVERAGE}" ]; then
            echo "FAILED: line coverage (${LINE_PCT:-0}%) below ${MIN_COVERAGE}%"; exit 1
          fi
          echo "PASSED: coverage gate met"
