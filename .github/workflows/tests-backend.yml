name: Backend Tests (reusable)

# The backend test job, factored out so the pre-merge gate (ci.yml) and the
# release gate (release.yml) run the IDENTICAL thing. Before this existed there
# was no pre-merge gate at all -- every workflow was push-to-main or
# push-to-develop, so tests only ever ran on code that had already landed.
# Duplicating the job into a second workflow would have re-created that problem
# in slow motion, as the two copies drifted.

on:
  workflow_call:
    inputs:
      coverage-floor:
        description: 'Minimum line coverage percent. Ratchet up, never down.'
        required: false
        default: 41
        type: number

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit pyflakes ruff mypy types-requests
      - name: Undefined names (ENFORCING)
        # A name used but never defined is a NameError waiting for the first
        # request that reaches that line, and Python only finds out then. Four
        # were live in production on 2026-09-02, each a 500 that read as
        # something else: creating a class group chat ("Failed to create class
        # group chat", Sentry OPTIO-BACKEND-7R), registering a student with a
        # date of birth, saving a quest's is_public, and /api/quest-ai/health,
        # which could only ever answer "unhealthy". Every one is a single
        # missing import that this step catches in seconds.
        #
        # Deliberately NOT the whole of pyflakes: unused imports, placeholder-
        # less f-strings and unused locals are ~1200 findings of style, and a
        # gate that must be argued with gets switched off. This is the subset
        # where the code is already broken, and it is at zero — keep it there.
        run: |
          # pyflakes exits 1 for findings of ANY kind, so the exit code says
          # nothing here; the grep decides. Syntax errors go to stderr, hence 2>&1.
          findings=$(python -m pyflakes backend 2>&1 || true)
          if echo "$findings" | grep -E 'undefined name|referenced before assignment|invalid syntax'; then
            echo "::error::pyflakes found undefined names — each one is a NameError in production"
            exit 1
          fi
      - name: Ruff (ENFORCING)
        # CI-01. Config and rationale live in ruff.toml at the repo root; the
        # ruleset is narrow on purpose, for the same reason the pyflakes step
        # above greps only for undefined names -- a gate you have to argue with
        # gets switched off.
        #
        # It went from 1364 findings to zero on 2026-09-03, so this is enforcing
        # from its first run rather than starting as advisory. Ratchet the
        # ruleset UP by adding rules to ruff.toml; never silence a finding by
        # removing one.
        run: |
          ruff check backend || {
            echo "::error::ruff found lint errors -- run 'ruff check backend --fix' locally"
            exit 1
          }

      - name: Mypy (ENFORCING on the typed subset)
        # CI-01. mypy had never run here, and two bugs had to be fixed before it
        # could: mypy.ini's `exclude` had its closing paren at column 0, which
        # ends a multi-line value early and made every per-module setting below
        # it dead (including two `disallow_untyped_defs` overrides from Dec 2025
        # that had therefore never applied); and services/ was the only package
        # directory without __init__.py, so mypy saw one module under two names
        # and refused to check anything.
        #
        # With those fixed, 296 of 1019 modules still fail -- 7738 errors, four
        # thousand of them Optional-without-a-guard. Those modules are exempted
        # by name in mypy.ini and the list only shrinks. What this gate buys
        # today is that a NEW type error in the ~720 clean modules fails the
        # build.
        run: |
          mypy --config-file backend/mypy.ini backend || {
            echo "::error::mypy found type errors in a module that was clean"
            exit 1
          }

      - name: pip-audit (fail on high/critical CVEs)
        # DEP-H1 fix: audit the ROOT requirements.txt — that is the file Render
        # actually deploys (render.yaml rootDir: "" + pip install -r
        # requirements.txt). Previously this ran in backend/ and audited
        # backend/requirements.txt, so the enforcing gate was blind to prod.
        # Supply-chain gate (enforcing). Documented ignores re-reviewed per bump:
        # NO SUPPRESSIONS. All three were re-reviewed on 2026-09-03 (HYG-03)
        # and none survived:
        # - PYSEC-2024-271 (flask-cors) and PYSEC-2025-183 (pyjwt) are no longer
        #   reported at all against the pinned versions -- the ignores had gone
        #   stale and were silencing nothing.
        # - PYSEC-2026-1845 (pytest) was real. It is fixed by the 9.0.3 bump in
        #   requirements.txt rather than ignored; the reason it had been ignored
        #   ("a major bump, and pytest is test-only") stopped applying once the
        #   local venv had been running the whole suite on 9.0.3 anyway.
        #
        # Add one back only with a dated reason AND a re-check date. An ignore
        # nobody revisits is a vulnerability with a comment on it.
        run: |
          pip-audit --requirement requirements.txt \
            --strict \
            --vulnerability-service osv \
            || { echo "::error::pip-audit found vulnerabilities"; exit 1; }
      - name: Secret-exposure guards (ENFORCING)
        working-directory: backend
        # These encode the 2026-08-01 critical findings (AUDIT.md C1/C2/C3):
        # a live Stripe secret key readable over the public anon key, and two
        # tables shipped without RLS. They are pure/static -- no database, no
        # network -- so unlike the suite below they can and do gate the build.
        #
        # Deliberately a SEPARATE step from the full suite underneath: folding
        # them together would make a single failure ambiguous.
        env:
          FLASK_ENV: testing
          FLASK_SECRET_KEY: test-secret-key-for-ci-only
        run: |
          # No --no-cov needed any more: coverage left pytest.ini's addopts on
          # 2026-08-13, so a single-file run no longer inherits a whole-suite
          # coverage gate. It used to, and this step exited 1 with all 42 guards
          # passing -- reported as "Secret-exposure guard failed", the opposite
          # of what happened.
          python -m pytest tests/test_secret_exposure_guard.py \
            --tb=short -v --no-header -p no:cacheprovider \
            || { echo "::error::Secret-exposure guard failed -- see AUDIT.md"; exit 1; }

      - name: Run pytest (ENFORCING)
        working-directory: backend
        # `|| true` removed 2026-08-01. It had made the whole backend suite
        # advisory: 455 collection errors and 164 failures had accumulated
        # unseen, including a stored-XSS iframe bypass, an app that could not
        # boot without GEMINI_API_KEY, and a CSRF-exempt entry missing for the
        # iCreate fee step. A suite that cannot fail teaches nothing.
        #
        # Placeholder Supabase credentials are supplied because unit tests need
        # to CONSTRUCT a client against mocks; nothing here reaches a real
        # database. Tests that genuinely need one are marked `requires_db` and
        # skip unless RUN_DB_INTEGRATION_TESTS=1 -- tests-integration.yml runs
        # those against a throwaway local Supabase stack.
        #
        # test_admin_client_justified is ENFORCING again as of 2026-09-03
        # (SEC-13). It was deselected while ~195 get_supabase_admin_client()
        # calls carried no justification comment -- each an un-audited RLS
        # bypass -- on the reasoning that keeping it visible beat re-baselining
        # it away. The calls have since been annotated and the test passes, so
        # the deselect went with them. Adding an unjustified admin client now
        # fails the build, which is the whole point.
        env:
          FLASK_ENV: testing
          FLASK_SECRET_KEY: test-secret-key-for-ci-only
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SUPABASE_ANON_KEY: placeholder-anon-key
        run: |
          # The floor is an input so both callers share one number, and so
          # raising it is a one-line change in ci.yml/release.yml rather than an
          # edit in two places that can disagree. Measured 41.95% on 2026-08-13
          # WITHOUT the requires_db tests (they run in tests-integration.yml).
          # Raise this by adding coverage to THIS run, never by folding database
          # tests back in.
          python -m pytest tests/ --tb=short -v -p no:cacheprovider \
            --cov=. --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=${{ inputs.coverage-floor }}
