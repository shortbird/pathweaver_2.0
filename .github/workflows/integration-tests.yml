name: Integration Tests (live database)

# Runs the `requires_db` tests -- the ones that drive the real Flask app end to
# end, where /api/health pings the database and login/profile reads go through
# PostgREST. They cannot pass against mocks, so release.yml skips them and this
# workflow points them at a real database instead.
#
# WHY A SUPABASE BRANCH AND NOT `supabase start`
# ----------------------------------------------
# The local stack cannot work: supabase/migrations/ has no baseline. Its earliest
# file (20250130_legal_compliance.sql) opens with `ALTER TABLE public.users`, and
# nothing in the repo ever creates that table -- the core schema was built outside
# the migration history. Run 1 of this workflow proved it:
#     Applying migration 20250130_legal_compliance.sql...
#     ERROR: relation "public.users" does not exist (SQLSTATE 42P01)
# A Supabase BRANCH sidesteps this entirely: branches are cloned from the
# production schema, so the tables already exist.
#
# STATUS: NOT IN THE DEPLOY GATE. Prove it green by hand first, then add
# `integration` to the `deploy` job's `needs:` in release.yml.
#
# REQUIRED SECRETS (repo settings -> Secrets and variables -> Actions):
#   SUPABASE_TEST_URL                -- e.g. https://<branch-ref>.supabase.co
#   SUPABASE_TEST_SERVICE_ROLE_KEY   -- that branch's service_role key
#   SUPABASE_TEST_ANON_KEY           -- that branch's anon key
#
# These tests WRITE to the public schema of whatever they point at (see the
# guard below), so the URL must be a disposable branch -- never production.

on:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The production project. The guard below refuses to run against it.
  PROD_PROJECT_REF: vvfgxcykxjybtvpfzwyx

jobs:
  integration:
    name: Backend integration (branch database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Refuse to run against production
        # These tests insert users and quests and delete rows on teardown. A
        # mistyped secret pointing at prod would do real damage, and the schema
        # isolation that was supposed to prevent that does not work (conftest
        # sets an X-Supabase-Schema header; PostgREST reads Accept-Profile /
        # Content-Profile, so the header is ignored and everything lands in
        # public). This check is the only thing standing between a wrong secret
        # and production data.
        env:
          TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_URL:-}" ]; then
            echo "::error::SUPABASE_TEST_URL is not set. Create a Supabase branch and add its URL as a repo secret."
            exit 1
          fi
          if printf '%s' "$TEST_URL" | grep -q "$PROD_PROJECT_REF"; then
            echo "::error::SUPABASE_TEST_URL points at the PRODUCTION project ($PROD_PROJECT_REF). Refusing to run."
            exit 1
          fi
          echo "Target is not production. Proceeding."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run requires_db tests
        working-directory: backend
        env:
          FLASK_ENV: testing
          FLASK_SECRET_KEY: test-secret-key-for-ci-only
          RUN_DB_INTEGRATION_TESTS: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: |
          # --no-cov because pytest.ini sets --cov-fail-under=40 in addopts and
          # this is a subset; without it the job fails with every test passing.
          python -m pytest tests/ -m requires_db --tb=short -v -p no:cacheprovider --no-cov
