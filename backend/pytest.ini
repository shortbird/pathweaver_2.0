[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage is NOT in addopts, on purpose.
#
# It used to be (--cov=. --cov-report=... --cov-fail-under=40), which meant every
# partial run inherited a whole-suite coverage gate. Run one file and it would
# exit 1 with every test passing, because one file does not cover 40% of the
# backend. That produced "Secret-exposure guard failed" in CI when all 42 guards
# had in fact passed, and three separate workflow steps grew a --no-cov flag and
# a paragraph of comment explaining why it was load-bearing.
#
# CI asks for coverage explicitly, once, in tests-backend.yml, where the floor is
# an input shared with ci.yml and release.yml. Locally:
#
#     pytest tests/unit/test_foo.py          # fast, no coverage
#     pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=41
#
# --cov-report=html is also gone: CI never opened htmlcov/ and writing it cost
# time on every run. Pass it by hand when you want to read it.
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    unit: Unit tests (fast, mocked dependencies)
    integration: Integration tests (real database)
    critical: Critical path tests (must pass for production)
    slow: Slow running tests (>1 second)
    security: Security regression tests (authz, secret exposure, injection)
    authorization: Role and permission boundary tests
    requires_db: Needs a live Supabase (PostgREST + auth), not just mocks.
        Skipped unless RUN_DB_INTEGRATION_TESTS=1. CI supplies a throwaway local
        stack via .github/workflows/tests-integration.yml. NOTE: these tests do
        not currently pass against any database -- see
        backend/tests/integration/README.md before adding to them.
