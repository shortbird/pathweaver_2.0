[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=40
markers =
    unit: Unit tests (fast, mocked dependencies)
    integration: Integration tests (real database)
    critical: Critical path tests (must pass for production)
    slow: Slow running tests (>1 second)
    security: Security regression tests (authz, secret exposure, injection)
    authorization: Role and permission boundary tests
    requires_db: Needs a live Supabase (PostgREST + auth), not just mocks.
        Skipped unless RUN_DB_INTEGRATION_TESTS=1. CI supplies one via
        .github/workflows/integration-tests.yml.